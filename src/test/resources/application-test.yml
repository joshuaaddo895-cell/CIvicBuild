spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: test-jwt-secret-at-least-thirty-two-bytes-long
    issuer: civicbuild-test
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
  password-reset:
    token-ttl: PT30M
  rate-limit:
    enabled: true
    max-attempts: 5
    window: PT15M
  email:
    resend-api-key: re_test_dummy
    from: CivicBuild Test <test@example.com>
    reset-base-url: http://localhost:8080/reset-password
  google:
    web-client-id: test-google-web-client-id.apps.googleusercontent.com

logging:
  level:
    backend.example.civicbuild: WARN
