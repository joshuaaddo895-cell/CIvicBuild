server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: civicbuild

  autoconfigure:
    exclude:
      # We use JWT auth only — disable the default in-memory user + login form.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # Datasource is built programmatically from NEON_DATABASE_URL (postgresql://...)
  # by NeonDataSourceConfig, because pgjdbc requires the jdbc:postgresql:// form
  # and separate credentials. We only reference the env var, never a literal URL.
  datasource:
    hikari:
      pool-name: civicbuild-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must never mutate it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL}
      timeout: 2000ms

# ---- Application-specific configuration ----
app:
  jwt:
    # HS256 signing secret, min 32 bytes. Loaded from env, never committed.
    secret: ${JWT_SECRET}
    issuer: civicbuild
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}   # 15 minutes
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}    # 7 days
  password-reset:
    token-ttl: ${PASSWORD_RESET_TTL:PT30M}       # 30 minutes
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    window: ${RATE_LIMIT_WINDOW:PT15M}           # 15 minutes
  email:
    resend-api-key: ${RESEND_API_KEY}
    from: ${EMAIL_FROM:CivicBuild <onboarding@resend.dev>}
    reset-base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:8081/reset-password}
  google:
    # Audience check for Google ID tokens. Client secret is NOT used for ID-token verification.
    web-client-id: ${GOOGLE_WEB_CLIENT_ID}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    # Include the correlation id (MDC) in every log line.
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
